name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r custom_components/aritech_ats/requirements-test.txt
          pip install aritech-client

      - name: Run tests
        run: |
          pytest custom_components/aritech_ats/tests/ -v --tb=short
